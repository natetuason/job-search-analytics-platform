# Company job boards to fetch. Edit freely.
#   name:  display name (Lever doesn't return one, so it's required there)
#   ats:   greenhouse | lever | ashby
#   token: the board slug, e.g. boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>
#
# Every board below was checked against the live public API on 2026-11-03 and
# had at least one posting with "analyst" in the title. Add companies you care
# about; a wrong token just records a failed run (HTTP 404) and moves on.

