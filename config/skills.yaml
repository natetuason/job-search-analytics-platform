# Skill vocabulary used to read job descriptions. Each canonical skill lists regex
# patterns (case-insensitive, matched on word boundaries). Skills I don't have are
# listed too, so the scorer can name what a job asks for that I'm missing.
# My own skill levels live in data/private/profile.yaml.

skills:
  SQL: ['sql', 'postgres(?:ql)?', 'mysql', 't-sql', 'pl/sql']
  Snowflake: ['snowflake']
  Python: ['python', 'pandas']
  R: ['(?<![&/])r(?![&/])', 'rstudio', 'tidyverse']
  Java: ['java']
  Tableau: ['tableau']
  QuickSight: ['quicksight']
  Power BI: ['power ?bi']
  Excel: ['excel', 'spreadsheets?', 'pivot tables?', 'vlookup', 'xlookup']
  PowerPoint: ['powerpoint', 'slide decks?']
  Word: ['microsoft word', 'ms word']
  Jira: ['jira']
  SAP: ['sap', 's/4 ?hana']
  Dashboards & BI reporting: ['dashboards?', 'business intelligence', 'bi tools?', 'reporting', 'reports']
  Data visualization: ['data visuali[sz]ation', 'visuali[sz]ations?']
  Data cleaning: ['data cleaning', 'data cleansing', 'data wrangling', 'data quality', 'data validation']
  Requirements gathering: ['requirements gathering', 'gather(?:ing)? requirements', 'business requirements', 'user stories', 'reporting requirements']
  Stakeholder management: ['stakeholders?', 'cross-functional', 'cross functional']
  Process improvement: ['process improvements?', 'process mapping', 'workflows?', 'process optimi[sz]ation', 'bottlenecks?']
  Risk & controls: ['risk management', 'internal controls?', 'risk and controls?', 'controls? testing', 'key risk indicators', 'kris?', 'compliance']
  KPIs & metrics: ['kpis?', 'metrics']
  Presentations: ['presentations?', 'present(?:ing)? (?:findings|insights|to)', 'storytelling']
  Documentation: ['documentation', 'document(?:ing)? (?:processes|requirements)']
  Market research: ['market research', 'competitive analysis', 'industry research']
  Portfolio analysis: ['portfolio analysis', 'portfolio management']
  Financial modeling: ['financial model(?:ing|ling|s)?', 'fp&a', 'budgeting', 'variance analysis']
  Agile: ['agile', 'scrum', 'sprints?']
  Forecasting: ['forecast(?:ing|s)?', 'time series']
  Regression & econometrics: ['regression', 'econometrics?']
  Statistics: ['statistics', 'statistical', 'hypothesis testing']
  Demand planning: ['demand planning', 'demand forecasting', 's&op', 'sales and operations planning', 'supply planning']
  Data management: ['data management', 'data governance', 'master data']
  Supply chain: ['supply chain', 'logistics', 'procurement', 'inventory', 'sourcing', 'fulfillment', 'distribution']
  Generative AI: ['generative ai', 'genai', 'llms?', 'large language models?']
  # Skills not on my resume (for "missing" lists)
  Looker: ['looker']
  dbt: ['dbt']
  Spark: ['spark', 'pyspark']
  Airflow: ['airflow']
  Cloud platforms: ['aws', 'gcp', 'google cloud', 'azure', 'redshift', 'bigquery']
  Databricks: ['databricks']
  Machine learning: ['machine learning', 'ml models?', 'predictive model(?:ing|s)?', 'scikit-learn']
  A/B testing: ['a/b test(?:ing|s)?', 'experimentation']
  Alteryx: ['alteryx']
  VBA: ['vba', 'macros']
  SAS: ['sas']
  Salesforce: ['salesforce']
  Oracle/NetSuite: ['oracle', 'netsuite']
  Supply planning software: ['kinaxis', 'blue yonder', 'o9', 'anaplan', 'sap ibp', 'manhattan associates']
  Product analytics tools: ['amplitude', 'mixpanel', 'google analytics', 'heap']
  Git: ['git', 'github']
  Accounting: ['gaap', 'general ledger', 'reconciliations?', 'accounts payable', 'accounts receivable']
