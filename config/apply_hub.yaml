# Apply hub: places the app does NOT fetch automatically (terms, CAPTCHAs, or no public
# API), so I visit them myself. The app only lists and opens these links.
#
#   searches:  turned into pre-filtered LinkedIn and Indeed search links (entry level,
#              past week, newest first). Those sites are never contacted by the app.
#   sites:     job sites to check by hand.
#   employers: career sites, mostly Workday or custom portals.
#              checked: date the link was confirmed to open; "blocked" means the site
#              refuses automated checks (it opens fine in a browser).
#
# Personal links (your school's career portal, ...) go in data/private/apply_hub.yaml (git-ignored),
# same format with `sites:` and/or `employers:`; they're listed first.

searches:
  locations: ["New York City Metropolitan Area", "New Jersey, United States"]
  keywords:
    - Business Analyst
    - Data Analyst
    - Supply Chain Analyst
    - Demand Planning Analyst
    - Strategy and Operations Analyst
    - Risk Analyst
    - Technology Analyst
    - Associate Product Manager
    - Rotational Program Analyst

sites:
  - { name: Handshake,                      url: "https://joinhandshake.com/", note: "Campus recruiting; use your school's Handshake link (add it in data/private/apply_hub.yaml)" }
  - { name: Jobright,                       url: "https://jobright.ai/jobs" }
  - { name: Simplify new grad data/AI,      url: "https://simplify.jobs/l/New-Grad-Data-Science-AI-ML", note: "Same jobs also arrive via the Simplify GitHub list" }
  - { name: newgrad.ai product,             url: "https://newgrad.ai/jobs/fields/product" }
  - { name: Boardsweep new grad product,    url: "https://boardsweep.io/new-grad/product" }
  - { name: Welcome to the Jungle,          url: "https://www.welcometothejungle.com/en/get-started/jobs-preview" }
  - { name: SWE Job Lists CSV download,     url: "https://swejoblists.com/download", note: "Download, then: python -m app.cli import-csv <file>" }
  - { name: USAJOBS,                        url: "https://www.usajobs.gov/" }

