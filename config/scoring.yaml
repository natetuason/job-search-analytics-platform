# Rule-based scorer tuning. Category weights (skills 30, experience 25, ...) live in
# Settings (user_settings.scoring_weights); everything else is here.
# Scores are match scores, not probabilities of an interview or offer.

rotational_bonus: 8          # points added for rotational / development programs
level_ii_penalty: 15         # experience points off for "Analyst II"-style titles
senior_pay_floor: 180000     # posted base minimum at/above this means a senior role (Skip)

posting_age:                 # older postings rank lower (posted date from the employer's board or the list)
  grace_days: 30             # no change for postings this new
  full_penalty_days: 180     # the penalty grows evenly until this age...
  max_penalty: 10            # ...and stays at this many points after it. No posted date: no penalty.

tiers:                       # qualitative labels
  strong_fit: { min_score: 70, min_experience: 80, min_skills: 55 }
  competitive: { min_score: 55 }

recommendation:
  apply_min_score: 60        # and tier is not Reach
  apply_min_responsibilities: 50   # the role itself must be target-like to get Apply
  maybe_min_responsibilities: 50   # below this (sales reps, research fellowships, ...) is Skip, unless rotational
  skip_below_score: 40

# Role types that are Skip even when the description mentions your tools (regex fragments, case-insensitive).
# Tuned for analyst / business roles. Targeting engineering, design, research, sales, ...? Remove those words
# here, or set an empty list [] to turn the rule off.
off_target_title_words:
  - 'engineer'
  - 'developer'
  - 'designer'
  - 'quant\b'
  - 'quantitative'
  - 'trader'
  - 'researcher'
  - 'scientist'
  - 'technician'
  - 'nurse'
  - 'therapist'
  - 'physician'
  - 'pharmacist'
  - 'recruiter'
  - 'account executive'
  - 'sales (?:representative|development)'
  - 'attorney'
  - 'counsel'
  - 'paralegal'
  - 'teacher'
  - 'driver'
  - 'machinist'
  - 'mechanic'
  - 'cashier'
  - 'server'
  - 'cook'
  - 'housekeep'
  - 'reporter'
  - 'editor'
  - 'writer'
  - 'producer'
  - 'journalist'
  - 'photographer'
  - 'operator'
  - 'stylist'
  - 'chef'
  - 'architect'
  - 'full[- ]?stack'
  - 'front[- ]?end'
  - 'back[- ]?end'

# Your hands-on tools (names from config/skills.yaml). A posting outside your target titles still counts as
# "uses your skills" when it names several of these.
tool_skills: [SQL, Snowflake, Python, R, Tableau, QuickSight, Power BI, Excel, SAP, Jira, Java]

location_points:             # 0-100 for the location category
  preferred: 100             # NYC, Jersey City, anywhere in NJ
  remote: 85                 # U.S. remote
  secondary: 50              # other big cities (eligible only at match score >= Settings minimum)

pay:                         # base pay, annualized (hourly x 2080)
  full_points_at: 110000     # 100 points at or above
  floor_points: 60           # points at Settings salary_min
  unknown_points: 50         # no posted pay and no estimate

estimate:                    # pay estimates from similar postings in the database
  min_samples: 10            # fewer similar postings means no estimate
  medium_confidence_at: 30   # this many or more -> medium confidence (estimates are never "high")
