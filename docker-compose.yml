services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to localhost only: not reachable from other machines on your network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CONFIG_DIR: /config
      PRIVATE_DIR: /data/private
      BACKLOG_DIR: /backlog
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/config:ro
      - ./data/private:/data/private:ro
      - ./backlog:/backlog
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # Scheduled updates: fetch, close gone listings, rescore (python -m app.scheduler). Read-only toward employers.
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CONFIG_DIR: /config
      PRIVATE_DIR: /data/private
      BACKLOG_DIR: /backlog
    volumes:
      - ./config:/config:ro
      - ./data/private:/data/private:ro
      - ./backlog:/backlog
    depends_on:
      api:
        condition: service_started
    command: python -m app.scheduler
    restart: unless-stopped

volumes:
  pgdata:
